# Every push: the tests without a window, then every example in its real window, on Windows and on macOS.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.9", "3.13", "3.15"]  # the oldest (the Python of macOS), one between, the newest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: The WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile webview2-setup.exe
          Start-Process -FilePath .\webview2-setup.exe -ArgumentList "/silent /install" -Wait
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pillow
      - name: The tests without a window
        run: python -m pytest tests
      - name: Every example in its real window
        run: python checks/run_all.py pictures
      - name: The pictures of the windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pictures-${{ matrix.os }}-${{ matrix.python }}
          path: pictures
          if-no-files-found: ignore
