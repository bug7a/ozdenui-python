# Every push: the tests without a window, then every example in its real window, on Windows, macOS and Linux.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.9", "3.13", "3.15"]  # the oldest (the Python of macOS), one between, the newest
        include:
          # WHY the Python of Ubuntu: the GTK web view comes from its packages (python3-gi); another Python would
          #     build PyGObject from its source. 24.04, not -latest: the packages below are named for it.
          - os: ubuntu-24.04
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: ${{ matrix.python }}
      - name: The WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile webview2-setup.exe
          Start-Process -FilePath .\webview2-setup.exe -ArgumentList "/silent /install" -Wait
      - name: The GTK web view and a virtual screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 xvfb xauth dbus-x11 fonts-dejavu-core fonts-noto-color-emoji
          python3 -m venv --system-site-packages "$HOME/venv"
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pillow
      - name: The tests without a window
        run: python -m pytest tests
      - name: Every example in its real window
        if: runner.os != 'Linux'
        run: python checks/run_all.py pictures
      - name: Every example in its real window
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python checks/run_all.py pictures
      - name: The pictures of the windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pictures-${{ matrix.os }}-${{ matrix.python }}
          path: pictures
          if-no-files-found: ignore
