                <h1>Modern desktop windows, in&nbsp;plain Python</h1>
                <p>Write the window in Python: boxes, texts, buttons and ready components appear in a small window of its own. Only Python: no JavaScript, no HTML, no browser tab, no server.</p>
                <p>v0.1.0 · experimental · Python 3.9+ · 53 components with a Python class · all 88 of basic.js by name · 12 MB with its window · Apache 2.0</p>
                <p><a href="handbook/" style="color: inherit;">The handbook</a>: ten short chapters, from the first window to a component of your own, in English and Turkish.</p>
                <h2>A counter in a few lines</h2>
                <p>Groups place the objects for you, and a function given to a button runs in Python when it is clicked.</p>
                <ul>
                    <li><b>with blocks.</b> The objects of a with block go into its group: the shape of the code is the shape of the window.</li>
                    <li><b>Values in Python.</b> count.text is read in Python, with no question to the window. Setting it changes the window.</li>
                    <li><b>One call for a function.</b> All the changes of a click go to the window together, so a click costs about 3 ms.</li>
                </ul>
                <h2>Small, fast enough, easy to read</h2>
                <ul>
                    <li><b>Small and offline.</b> The package carries basic.js and its components. With its window it is about 12 MB; no internet, no server, no browser tab.</li>
                    <li><b>Fast enough to forget.</b> A click reaches your Python function and comes back on the screen in about 3 ms. The window shows in about 0.5 s.</li>
                    <li><b>Code that reads like the window.</b> with blocks for groups, the names of basic.js, values read back without asking the window. An error points to your line.</li>
                    <li><b>Components ready.</b> 53 components have a Python class: buttons, fields, lists, a table, a chart, dialogs. All 88 of basic.js work with Component().</li>
                </ul>
                <h2>Ready components, Python classes</h2>
                <p>SmartButton, TextField, EmailField, PasswordField, NumberField, UrlField, PhoneField, CurrencyField, TextAreaField, TagInput, SearchInput, CheckBox, Toggle, RadioButton, SelectBox, Slider, RangeSlider, SliderField, Stepper, DatePicker, TimePicker, ColorPicker, FilePicker, ProgressBar, StepBar, LoadingScreen, Canvas, ItemList, SortableList, SmartTable, DataTable, TreeView, Tabs, Accordion, SidePanel, ScrollArea, GridGroup, GraphBox, LogView, ImageView, MarkdownView, JsonView, JsonEditor, ChatView, WebView, MenuBar, ToolBar, ContextMenu, StatusBar, Splitter, CodeEditor, Tooltip, Dialog and Toast. Each one takes its params in snake_case and a Python function for a callback.</p>
                <h2>A component of your own, in plain Python</h2>
                <p>A class that makes its objects in a with block is a component: use it again and again, change it with its methods, share it as a .py file. No JavaScript is needed.</p>
                <h2>A dialog that returns its answer</h2>
                <p>Dialog.confirm() waits for the answer and returns it, like any function. The window keeps working meanwhile: timers run and the page is drawn.</p>
                <h2>Twenty-six small programs</h2>
                <p>A small code editor, A small Markdown editor, A small JSON viewer, A small JSON editor, A chat, Photos, Paint, Charts, A file tool, CSV viewer, A form, Image viewer, A job and its log, Word counter, To do, Settings, Dialogs, Gallery, The minimal look, The minimal look in a color, Calculator, The basic objects, Counter, Greeting, Clock and Catch the dots, in the examples folder of the source. Each one is checked in its real window.</p>
                <h2>Where it fits</h2>
                <p>A good choice for a small tool or a script that needs a window, for teaching Python with something to see, and for a modern look without learning Qt, HTML or CSS. For a large desktop application, Qt (PySide6) or Flet is better; for a web application for many users, NiceGUI or a web framework; for a data dashboard in the browser, Streamlit.</p>
                <h2>Three steps</h2>
                <ol>
                    <li><b>Install.</b> Not on PyPI yet. Until then, install it from its source folder, in a virtual environment. It brings pywebview, the window of the system.</li>
                    <li><b>Write start(page).</b> Make the objects of the window in it. Groups place them; a function runs on a click.</li>
                    <li><b>Run it.</b> A window opens. Your program ends when it is closed.</li>
                </ol>
